name: Docker

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  scan-compose-images:
    name: Scan Compose infrastructure images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull pinned OTLP Collector image
        run: docker pull otel/opentelemetry-collector:0.159.0

      - name: Scan OTLP Collector before publishing application images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: otel/opentelemetry-collector:0.159.0
          trivyignores: ${{ github.workspace }}/.trivyignore-collector
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  build-push:
    needs: scan-compose-images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/docker/Dockerfile.api
          - name: worker
            dockerfile: deploy/docker/Dockerfile.worker
          - name: scheduler
            dockerfile: deploy/docker/Dockerfile.scheduler
          - name: migrations
            dockerfile: deploy/docker/Dockerfile.migrations
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/inkflow-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[1] }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Publish scanned image tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"

  verify-published-compose:
    name: Verify published Compose images
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull every image referenced by the release Compose file
        run: docker compose -f docker-compose.yml pull
