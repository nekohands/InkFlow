name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # smoke 验证当前 commit 的源码构建产物;GHCR 预构建镜像由 docker.yml 单独构建发布。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InkFlow.sln

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build InkFlow.sln --configuration Release --no-restore

      - name: Verify migrations
        run: bash scripts/verify-migrations.sh

      - name: Test
        run: dotnet test InkFlow.sln --configuration Release --no-build --verbosity normal

      - name: Validate Compose
        run: docker compose -f docker-compose.build.yml config --quiet

      - name: Core SLO probe script regression
        run: |
          bash -n scripts/core-slo-runtime-smoke.sh
          bash -n scripts/tests/core-slo-runtime-smoke.fixture-curl.sh
          bash -n scripts/tests/core-slo-runtime-smoke.test.sh
          bash scripts/tests/core-slo-runtime-smoke.test.sh

      - name: Reader frontend smoke script regression
        run: |
          bash -n scripts/reader-frontend-runtime-smoke.sh
          bash -n scripts/tests/reader-frontend-runtime-smoke.fixture-curl.sh
          bash -n scripts/tests/reader-frontend-runtime-smoke.test.sh
          bash scripts/tests/reader-frontend-runtime-smoke.test.sh

      - name: Reader account smoke script regression
        run: |
          bash -n scripts/reader-account-runtime-smoke.sh
          bash -n scripts/tests/reader-account-runtime-smoke.test.sh
          bash scripts/tests/reader-account-runtime-smoke.test.sh

      - name: Reader content smoke script regression
        run: |
          bash -n scripts/reader-content-runtime-smoke.sh
          bash -n scripts/tests/reader-content-runtime-smoke.fixture-curl.sh
          bash -n scripts/tests/reader-content-runtime-smoke.test.sh
          bash scripts/tests/reader-content-runtime-smoke.test.sh

      - name: Opt-in live source acceptance script regression
        run: bash -n scripts/kanunu-live-acceptance.sh

      - name: Private library smoke script regression
        run: |
          bash -n scripts/private-library-runtime-smoke.sh
          bash -n scripts/tests/private-library-runtime-smoke.test.sh
          bash scripts/tests/private-library-runtime-smoke.test.sh

      - name: Developer API smoke script regression
        run: |
          bash -n scripts/developer-api-runtime-smoke.sh
          bash -n scripts/tests/developer-api-runtime-smoke.test.sh
          bash scripts/tests/developer-api-runtime-smoke.test.sh

      - name: Admin runtime smoke script regression
        run: |
          bash -n scripts/admin-runtime-smoke.sh
          bash -n scripts/tests/admin-runtime-smoke.test.sh
          bash scripts/tests/admin-runtime-smoke.test.sh

      - name: Local env loader regression
        run: |
          bash -n scripts/load-local-env.sh
          bash -n scripts/tests/load-local-env.test.sh
          bash scripts/tests/load-local-env.test.sh

      - name: Runtime smoke test
        env:
          OTEL_METRIC_EXPORT_INTERVAL: "1000"
          INKFLOW_OTEL_METRICS_DEBUG_VERBOSITY: "detailed"
        run: |
          docker compose -f docker-compose.build.yml up -d --build --wait api worker scheduler otel-collector
          curl --fail --silent http://localhost:13133/
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8081/health
          curl --fail --silent http://localhost:8082/health
          echo "--- GET /api/v1/books ---"
          curl --fail --silent http://localhost:8080/api/v1/books || {
            echo "catalog endpoint failed; dumping api logs:"
            docker compose -f docker-compose.build.yml logs --no-color api
            exit 1
          }
          echo "--- authentication and authorization smoke ---"
          unauthenticated_status=$(curl --silent --output /tmp/auth-me.json --write-out '%{http_code}' http://localhost:8080/api/v1/auth/me)
          test "$unauthenticated_status" = "401"
          consistency_status=$(curl --silent --output /tmp/consistency.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/consistency)
          test "$consistency_status" = "401"
          source_health_status=$(curl --silent --output /tmp/source-health.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/sources/official-a/health)
          test "$source_health_status" = "401"
          source_permissions_status=$(curl --silent --output /tmp/source-permissions.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/sources/official-a/permissions)
          test "$source_permissions_status" = "401"
          operations_overview_status=$(curl --silent --output /tmp/operations-overview.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/operations/overview)
          test "$operations_overview_status" = "401"
          operations_alerts_status=$(curl --silent --output /tmp/operations-alerts.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/operations/alerts)
          test "$operations_alerts_status" = "401"
          operations_alert_history_status=$(curl --silent --output /tmp/operations-alert-history.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/operations/alerts/history)
          test "$operations_alert_history_status" = "401"
          audit_read_status=$(curl --silent --output /tmp/audit-read.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/audit/events)
          test "$audit_read_status" = "401"
          reading_status=$(curl --silent --output /tmp/reading-shelf.json --write-out '%{http_code}' http://localhost:8080/api/v1/me/reading/shelf)
          test "$reading_status" = "401"
          registration=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-auth@example.com","password":"correct horse battery staple"}' \
            http://localhost:8080/api/v1/auth/register)
          access_token=$(printf '%s' "$registration" | jq -er '.access_token')
          refresh_token=$(printf '%s' "$registration" | jq -er '.refresh_token')
          test -n "$access_token"
          test -n "$refresh_token"
          curl --fail --silent \
            -H "Authorization: Bearer $access_token" \
            http://localhost:8080/api/v1/auth/me | jq -e '.email == "ci-auth@example.com"'
          rotated=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d "{\"refresh_token\":\"$refresh_token\"}" \
            http://localhost:8080/api/v1/auth/refresh)
          rotated_access_token=$(printf '%s' "$rotated" | jq -er '.access_token')
          rotated_refresh_token=$(printf '%s' "$rotated" | jq -er '.refresh_token')
          test "$rotated_refresh_token" != "$refresh_token"
          curl --fail --silent \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/me | jq -e '.role == "Reader"'
          reader_operations_alerts_status=$(curl --silent --output /tmp/reader-operations-alerts.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/admin/operations/alerts)
          test "$reader_operations_alerts_status" = "403"
          curl --fail --silent \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/me/reading/preferences | jq -e '.theme == "System" and .fontSizePercent == 100'
          curl --fail --silent --request PUT \
            -H "Authorization: Bearer $rotated_access_token" \
            -H 'Content-Type: application/json' \
            -d '{"fontSizePercent":110,"theme":"Sepia"}' \
            http://localhost:8080/api/v1/me/reading/preferences | jq -e '.theme == "Sepia" and .fontSizePercent == 110'
          legado_issue=$(curl --fail --silent --request POST \
            -H "Authorization: Bearer $rotated_access_token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Reading 3.0"}' \
            http://localhost:8080/api/v1/me/legado/tokens)
          legado_token=$(printf '%s' "$legado_issue" | jq -er '.token')
          legado_token_id=$(printf '%s' "$legado_issue" | jq -er '.id')
          test -n "$legado_token"
          test -n "$legado_token_id"
          printf '%s' "$legado_issue" | jq -e '.bookSource.header != null and (.bookSource.searchUrl | contains("/api/legado/v1/personal/search"))'
          printf '%s' "$legado_issue" | jq -e --arg token "$legado_token" '.bookSource.header | fromjson | .["X-InkFlow-Legado-Token"] == $token'
          personal_search_status=$(curl --silent --output /tmp/personal-legado-search.json --write-out '%{http_code}' \
            -H "X-InkFlow-Legado-Token: $legado_token" \
            'http://localhost:8080/api/legado/v1/personal/search?q=')
          test "$personal_search_status" = "200"
          jq -e '.data | type == "array"' /tmp/personal-legado-search.json
          curl --fail --silent \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/me/legado/tokens | \
            jq -e --arg token_id "$legado_token_id" 'map(select(.id == $token_id)) | length == 1 and (.[0] | has("token") | not)'
          curl --fail --silent --request DELETE \
            -H "Authorization: Bearer $rotated_access_token" \
            "http://localhost:8080/api/v1/me/legado/tokens/$legado_token_id"
          revoked_legado_status=$(curl --silent --output /tmp/personal-legado-revoked.json --write-out '%{http_code}' \
            -H "X-InkFlow-Legado-Token: $legado_token" \
            'http://localhost:8080/api/legado/v1/personal/search?q=')
          test "$revoked_legado_status" = "401"
          curl --fail --silent --request POST \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/logout
          logged_out_status=$(curl --silent --output /tmp/auth-me-after-logout.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/me)
          test "$logged_out_status" = "401"
          echo "--- GET /legado/book-source.json ---"
          curl --fail --silent http://localhost:8080/legado/book-source.json || {
            echo "legado manifest endpoint failed; dumping api logs:"
            docker compose -f docker-compose.build.yml logs --no-color api
            exit 1
          }

      - name: Frontend 1.0 runtime smoke
        run: |
          chmod +x scripts/reader-frontend-runtime-smoke.sh
          scripts/reader-frontend-runtime-smoke.sh http://localhost:8080

      - name: Reader account runtime smoke
        run: |
          set -euo pipefail
          test_password='correct horse battery staple'
          run_id="$(date -u +%s%N)-$$"
          reader_email="ci-reader-account-$run_id@example.com"
          fixture_cmd=(docker compose -f docker-compose.build.yml --profile acceptance run --rm --no-deps acceptance-fixtures)

          cleanup() {
            set +e
            "${fixture_cmd[@]}" disable-user "$reader_email" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          fixture_json="$("${fixture_cmd[@]}" ensure-reader-catalog | tail -n 1)"
          book_id="$(printf '%s' "$fixture_json" | jq -er '.bookId')"
          chapter_id="$(printf '%s' "$fixture_json" | jq -er '.chapterId')"

          env \
            "INKFLOW_READER_ACCOUNT_SMOKE_EMAIL=$reader_email" \
            "INKFLOW_READER_ACCOUNT_SMOKE_PASSWORD=$test_password" \
            "INKFLOW_READER_ACCOUNT_SMOKE_BOOK_ID=$book_id" \
            "INKFLOW_READER_ACCOUNT_SMOKE_CHAPTER_ID=$chapter_id" \
            bash scripts/reader-account-runtime-smoke.sh http://localhost:8080

          env \
            "INKFLOW_READER_CONTENT_SMOKE_CHAPTER_ID=$chapter_id" \
            bash scripts/reader-content-runtime-smoke.sh http://localhost:8080

      - name: Private library runtime smoke
        run: |
          chmod +x scripts/private-library-runtime-smoke.sh
          scripts/private-library-runtime-smoke.sh http://localhost:8080

      - name: Developer API runtime smoke
        run: |
          chmod +x scripts/developer-api-runtime-smoke.sh
          scripts/developer-api-runtime-smoke.sh http://localhost:8080

      - name: Admin runtime smoke
        run: |
          set -euo pipefail
          test_password='correct horse battery staple'
          run_id="$(date -u +%s%N)-$$"
          admin_email="ci-admin-runtime-$run_id@example.com"
          operator_email="ci-operator-runtime-$run_id@example.com"
          fixture_cmd=(docker compose -f docker-compose.build.yml --profile acceptance run --rm --no-deps acceptance-fixtures)

          admin_payload="$(jq -nc --arg email "$admin_email" --arg password "$test_password" '{email: $email, password: $password}')"
          admin_registration="$(curl --fail --silent -H 'Content-Type: application/json' --data "$admin_payload" http://localhost:8080/api/v1/auth/register)"
          admin_token="$(printf '%s' "$admin_registration" | jq -er '.access_token')"

          operator_payload="$(jq -nc --arg email "$operator_email" --arg password "$test_password" '{email: $email, password: $password}')"
          operator_registration="$(curl --fail --silent -H 'Content-Type: application/json' --data "$operator_payload" http://localhost:8080/api/v1/auth/register)"
          operator_token="$(printf '%s' "$operator_registration" | jq -er '.access_token')"
          operator_id="$(printf '%s' "$operator_registration" | jq -er '.user.id')"

          cleanup() {
            set +e
            "${fixture_cmd[@]}" disable-user "$admin_email" >/dev/null 2>&1 || true
            "${fixture_cmd[@]}" disable-user "$operator_email" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          fixture_json="$("${fixture_cmd[@]}" ensure-catalog | tail -n 1)"
          source_id="$(printf '%s' "$fixture_json" | jq -er '.sourceId')"
          book_id="$(printf '%s' "$fixture_json" | jq -er '.bookId')"
          "${fixture_cmd[@]}" set-role "$admin_email" administrator >/dev/null
          "${fixture_cmd[@]}" set-role "$operator_email" operator >/dev/null

          env "INKFLOW_ADMIN_RUNTIME_SMOKE_ADMIN_TOKEN=$admin_token" "INKFLOW_ADMIN_RUNTIME_SMOKE_OPERATOR_TOKEN=$operator_token" "INKFLOW_ADMIN_RUNTIME_SMOKE_OPERATOR_ID=$operator_id" "INKFLOW_ADMIN_RUNTIME_SMOKE_BOOK_ID=$book_id" "INKFLOW_ADMIN_RUNTIME_SMOKE_SOURCE_ID=$source_id" bash scripts/admin-runtime-smoke.sh http://localhost:8080

      - name: Core SLO synthetic probe
        env:
          INKFLOW_SLO_EVIDENCE_FILE: ${{ runner.temp }}/inkflow-core-slo-evidence.json
          INKFLOW_SLO_PROBE_COUNT: "5"
          INKFLOW_SLO_CURL_MAX_TIME: "10"
        run: |
          chmod +x scripts/core-slo-runtime-smoke.sh
          scripts/core-slo-runtime-smoke.sh http://localhost:8080

      - name: Core SLO telemetry receipt smoke
        run: |
          sleep 5
          collector_logs="$(docker compose -f docker-compose.build.yml logs --no-color --since=30s --tail=20000 otel-collector)"
          for instrument in inkflow.slo.requests inkflow.slo.request.duration; do
            if [[ "$collector_logs" != *"$instrument"* ]]; then
              echo "Collector did not receive Core SLO instrument: $instrument"
              exit 1
            fi
          done
          for surface in public_api legado_api developer_api reader; do
            if [[ "$collector_logs" != *"$surface"* ]]; then
              echo "Collector did not receive Core SLO surface: $surface"
              exit 1
            fi
          done
          echo "Collector received Core SLO metrics for all four surfaces."

      - name: Upload Core SLO synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkflow-core-slo-synthetic-evidence
          path: ${{ runner.temp }}/inkflow-core-slo-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Redis distributed rate-limit integration
        env:
          INKFLOW_REDIS_CONNECTION: "localhost:6379,abortConnect=false"
        run: >-
          dotnet test tests/InkFlow.IntegrationTests/InkFlow.IntegrationTests.csproj
          --configuration Release --no-build --verbosity normal
          --filter FullyQualifiedName~RedisRateLimitingIntegrationTests

      - name: PostgreSQL backup and restore drill
        run: |
          chmod +x scripts/backup-restore-drill.sh
          scripts/backup-restore-drill.sh

      - name: Runtime diagnostics
        if: always()
        run: |
          docker compose -f docker-compose.build.yml ps --all || true
          docker compose -f docker-compose.build.yml logs --no-color || true
          docker compose -f docker-compose.build.yml down --volumes --remove-orphans || true
