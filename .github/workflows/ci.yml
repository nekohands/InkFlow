name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INKFLOW_ADMIN_BOOTSTRAP_KEY: ci-bootstrap-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore InkFlow.sln
      - name: Build
        run: dotnet build InkFlow.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test InkFlow.sln --configuration Release --no-build --verbosity normal
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Runtime smoke test
        run: |
          docker compose up -d --build --wait api worker scheduler
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8080/ready
          curl --fail --silent http://localhost:8080/api/v1/search?q=test
          curl --fail --silent http://localhost:8080/api/legado/v1/search?q=test
          curl --fail --silent http://localhost:8080/legado/book-source.json | grep -q 'ruleContent'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/admin/v1/sources)" = "401"
          curl --fail --silent -H "X-InkFlow-Admin-Key: ${INKFLOW_ADMIN_BOOTSTRAP_KEY}" http://localhost:8080/api/admin/v1/sources | grep -q '^\[\]$'
          curl --fail --silent -X POST \
            -H "X-InkFlow-Admin-Key: ${INKFLOW_ADMIN_BOOTSTRAP_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Fixture","baseUrl":"https://example.test","kind":"Official"}' \
            http://localhost:8080/api/admin/v1/sources | grep -q 'CI Fixture'
          curl --fail --silent -H "X-InkFlow-Admin-Key: ${INKFLOW_ADMIN_BOOTSTRAP_KEY}" http://localhost:8080/api/admin/v1/sources | grep -q 'CI Fixture'
          curl --fail --silent http://localhost:8081/health
          curl --fail --silent http://localhost:8081/ready
          curl --fail --silent http://localhost:8082/health
          curl --fail --silent http://localhost:8082/ready
          if docker compose logs --no-color migrations | grep -q 'Cannot load library libgssapi_krb5'; then
            echo 'Migration image is missing GSSAPI runtime support.' >&2
            exit 1
          fi
          if docker compose logs --no-color redis | grep -q 'does not require authentication'; then
            echo 'Redis started without authentication.' >&2
            exit 1
          fi
      - name: Runtime diagnostics
        if: always()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true
          docker compose down --volumes --remove-orphans || true
