name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # smoke 验证当前 commit 的源码构建产物;GHCR 预构建镜像由 docker.yml 单独构建发布。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InkFlow.sln

      - name: Build
        run: dotnet build InkFlow.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test InkFlow.sln --configuration Release --no-build --verbosity normal

      - name: Validate Compose
        run: docker compose -f docker-compose.build.yml config --quiet

      - name: Runtime smoke test
        run: |
          docker compose -f docker-compose.build.yml up -d --build --wait api worker scheduler
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8081/health
          curl --fail --silent http://localhost:8082/health
          echo "--- GET /api/v1/books ---"
          curl --fail --silent http://localhost:8080/api/v1/books || {
            echo "catalog endpoint failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          echo "--- authentication and authorization smoke ---"
          unauthenticated_status=$(curl --silent --output /tmp/auth-me.json --write-out '%{http_code}' http://localhost:8080/api/v1/auth/me)
          test "$unauthenticated_status" = "401"
          consistency_status=$(curl --silent --output /tmp/consistency.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/consistency)
          test "$consistency_status" = "401"
          source_health_status=$(curl --silent --output /tmp/source-health.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/sources/official-a/health)
          test "$source_health_status" = "401"
          operations_overview_status=$(curl --silent --output /tmp/operations-overview.json --write-out '%{http_code}' http://localhost:8080/api/v1/admin/operations/overview)
          test "$operations_overview_status" = "401"
          reading_status=$(curl --silent --output /tmp/reading-shelf.json --write-out '%{http_code}' http://localhost:8080/api/v1/me/reading/shelf)
          test "$reading_status" = "401"
          registration=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-auth@example.com","password":"correct horse battery staple"}' \
            http://localhost:8080/api/v1/auth/register)
          access_token=$(printf '%s' "$registration" | jq -er '.access_token')
          refresh_token=$(printf '%s' "$registration" | jq -er '.refresh_token')
          test -n "$access_token"
          test -n "$refresh_token"
          curl --fail --silent \
            -H "Authorization: Bearer $access_token" \
            http://localhost:8080/api/v1/auth/me | jq -e '.email == "ci-auth@example.com"'
          rotated=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d "{\"refresh_token\":\"$refresh_token\"}" \
            http://localhost:8080/api/v1/auth/refresh)
          rotated_access_token=$(printf '%s' "$rotated" | jq -er '.access_token')
          rotated_refresh_token=$(printf '%s' "$rotated" | jq -er '.refresh_token')
          test "$rotated_refresh_token" != "$refresh_token"
          curl --fail --silent \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/me | jq -e '.role == "Reader"'
          curl --fail --silent \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/me/reading/preferences | jq -e '.theme == "System" and .fontSizePercent == 100'
          curl --fail --silent --request PUT \
            -H "Authorization: Bearer $rotated_access_token" \
            -H 'Content-Type: application/json' \
            -d '{"fontSizePercent":110,"theme":"Sepia"}' \
            http://localhost:8080/api/v1/me/reading/preferences | jq -e '.theme == "Sepia" and .fontSizePercent == 110'
          legado_issue=$(curl --fail --silent --request POST \
            -H "Authorization: Bearer $rotated_access_token" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Reading 3.0"}' \
            http://localhost:8080/api/v1/me/legado/tokens)
          legado_token=$(printf '%s' "$legado_issue" | jq -er '.token')
          legado_token_id=$(printf '%s' "$legado_issue" | jq -er '.id')
          test -n "$legado_token"
          test -n "$legado_token_id"
          printf '%s' "$legado_issue" | jq -e '.bookSource.header != null and (.bookSource.searchUrl | contains("/api/legado/v1/personal/search"))'
          printf '%s' "$legado_issue" | jq -e --arg token "$legado_token" '.bookSource.header | fromjson | .["X-InkFlow-Legado-Token"] == $token'
          personal_search_status=$(curl --silent --output /tmp/personal-legado-search.json --write-out '%{http_code}' \
            -H "X-InkFlow-Legado-Token: $legado_token" \
            'http://localhost:8080/api/legado/v1/personal/search?q=')
          test "$personal_search_status" = "200"
          jq -e '.data | type == "array"' /tmp/personal-legado-search.json
          curl --fail --silent \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/me/legado/tokens | \
            jq -e --arg token_id "$legado_token_id" 'map(select(.id == $token_id)) | length == 1 and (.[0] | has("token") | not)'
          curl --fail --silent --request DELETE \
            -H "Authorization: Bearer $rotated_access_token" \
            "http://localhost:8080/api/v1/me/legado/tokens/$legado_token_id"
          revoked_legado_status=$(curl --silent --output /tmp/personal-legado-revoked.json --write-out '%{http_code}' \
            -H "X-InkFlow-Legado-Token: $legado_token" \
            'http://localhost:8080/api/legado/v1/personal/search?q=')
          test "$revoked_legado_status" = "401"
          curl --fail --silent --request POST \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/logout
          logged_out_status=$(curl --silent --output /tmp/auth-me-after-logout.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/me)
          test "$logged_out_status" = "401"
          echo "--- GET /legado/book-source.json ---"
          curl --fail --silent http://localhost:8080/legado/book-source.json || {
            echo "legado manifest endpoint failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          echo "--- GET /reader (web reader v1) ---"
          reader_page=$(curl --fail --silent http://localhost:8080/reader)
          printf '%s' "$reader_page" | grep -q "墨流" &&
          printf '%s' "$reader_page" | grep -q 'role="search"' &&
          printf '%s' "$reader_page" | grep -q 'class="search-bar"' &&
          printf '%s' "$reader_page" | grep -q 'prefers-reduced-motion' || {
            echo "reader page failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          echo "--- GET /reader PWA shell and account pages ---"
          manifest=$(curl --fail --silent http://localhost:8080/reader/manifest.webmanifest)
          printf '%s' "$manifest" | grep -q '"start_url": "/reader"' &&
          printf '%s' "$manifest" | grep -q '"display": "standalone"' &&
          printf '%s' "$manifest" | grep -q '192x192' &&
          printf '%s' "$manifest" | grep -q '512x512' || {
            echo "reader manifest failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          service_worker=$(curl --fail --silent http://localhost:8080/reader/sw.js)
          printf '%s' "$service_worker" | grep -q 'inkflow-reader-shell-v1' &&
          printf '%s' "$service_worker" | grep -q '/reader/offline' || {
            echo "reader service worker failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          account_page=$(curl --fail --silent http://localhost:8080/reader/account)
          printf '%s' "$account_page" | grep -q 'reader-login-form' &&
          printf '%s' "$account_page" | grep -q 'reader-register-form' || {
            echo "reader account page failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          shelf_page=$(curl --fail --silent http://localhost:8080/reader/shelf)
          printf '%s' "$shelf_page" | grep -q 'data-reader-dashboard="shelf"' || {
            echo "reader shelf page failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          history_page=$(curl --fail --silent http://localhost:8080/reader/history)
          printf '%s' "$history_page" | grep -q 'data-reader-dashboard="history"' || {
            echo "reader history page failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }

      - name: Runtime diagnostics
        if: always()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true
          docker compose down --volumes --remove-orphans || true
