name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InkFlow.sln

      - name: Build
        run: dotnet build InkFlow.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test InkFlow.sln --configuration Release --no-build --verbosity normal

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Runtime smoke test
        run: |
          docker compose up -d --build --wait api worker scheduler
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8081/health
          curl --fail --silent http://localhost:8082/health
          echo "Public catalog endpoint:"
          curl --fail --silent http://localhost:8080/api/v1/books

      - name: Runtime diagnostics
        if: always()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true
          docker compose down --volumes --remove-orphans || true
