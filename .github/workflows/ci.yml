name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # smoke 验证当前 commit 的源码构建产物;GHCR 预构建镜像由 docker.yml 单独构建发布。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InkFlow.sln

      - name: Build
        run: dotnet build InkFlow.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test InkFlow.sln --configuration Release --no-build --verbosity normal

      - name: Validate Compose
        run: docker compose -f docker-compose.build.yml config --quiet

      - name: Runtime smoke test
        run: |
          docker compose -f docker-compose.build.yml up -d --build --wait api worker scheduler
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8081/health
          curl --fail --silent http://localhost:8082/health
          echo "--- GET /api/v1/books ---"
          curl --fail --silent http://localhost:8080/api/v1/books || {
            echo "catalog endpoint failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          echo "--- authentication and authorization smoke ---"
          unauthenticated_status=$(curl --silent --output /tmp/auth-me.json --write-out '%{http_code}' http://localhost:8080/api/v1/auth/me)
          test "$unauthenticated_status" = "401"
          registration=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-auth@example.com","password":"correct horse battery staple"}' \
            http://localhost:8080/api/v1/auth/register)
          access_token=$(printf '%s' "$registration" | jq -er '.access_token')
          refresh_token=$(printf '%s' "$registration" | jq -er '.refresh_token')
          test -n "$access_token"
          test -n "$refresh_token"
          curl --fail --silent \
            -H "Authorization: Bearer $access_token" \
            http://localhost:8080/api/v1/auth/me | jq -e '.email == "ci-auth@example.com"'
          rotated=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d "{\"refresh_token\":\"$refresh_token\"}" \
            http://localhost:8080/api/v1/auth/refresh)
          rotated_access_token=$(printf '%s' "$rotated" | jq -er '.access_token')
          rotated_refresh_token=$(printf '%s' "$rotated" | jq -er '.refresh_token')
          test "$rotated_refresh_token" != "$refresh_token"
          curl --fail --silent \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/me | jq -e '.role == "Reader"'
          curl --fail --silent --request POST \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/logout
          logged_out_status=$(curl --silent --output /tmp/auth-me-after-logout.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $rotated_access_token" \
            http://localhost:8080/api/v1/auth/me)
          test "$logged_out_status" = "401"
          echo "--- GET /legado/book-source.json ---"
          curl --fail --silent http://localhost:8080/legado/book-source.json || {
            echo "legado manifest endpoint failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }
          echo "--- GET /reader (minimal web reader) ---"
          curl --fail --silent http://localhost:8080/reader | grep -q "墨流" || {
            echo "reader page failed; dumping api logs:"
            docker compose logs --no-color api
            exit 1
          }

      - name: Runtime diagnostics
        if: always()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true
          docker compose down --volumes --remove-orphans || true
