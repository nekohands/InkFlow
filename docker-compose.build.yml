# 源码构建编排:在本地从当前代码构建全部镜像并启动(适合开发与自定义修改)。
# 部署推荐使用 docker-compose.yml(直接拉取 GHCR 预构建镜像)。
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: inkflow
      POSTGRES_USER: inkflow
      POSTGRES_PASSWORD: ${INKFLOW_DB_PASSWORD:-inkflow}
    ports:
      - "5432:5432"
    volumes:
      - inkflow-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkflow -d inkflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - inkflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      INKFLOW_OTEL_METRICS_DEBUG_VERBOSITY: "${INKFLOW_OTEL_METRICS_DEBUG_VERBOSITY:-basic}"
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:13133:13133"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrations:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrations
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  acceptance-fixtures:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["acceptance"]
    working_dir: /workspace
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -Eeuo pipefail
        mkdir -p /tmp/inkflow
        tar --exclude='.env' --exclude='.env.*' --exclude='.git' -C /workspace -cf - . | tar --no-same-owner -C /tmp/inkflow -xf -
        cd /tmp/inkflow
        exec dotnet run --project tools/InkFlow.AcceptanceFixtures/InkFlow.AcceptanceFixtures.csproj --configuration Release -- "$$@"
      - --
    command: ["ensure-catalog"]
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      DOTNET_CLI_HOME: /tmp/dotnet
      NUGET_HTTP_CACHE_PATH: /tmp/nuget-http-cache
      NUGET_PACKAGES: /tmp/nuget-packages
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-60000}"
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-60000}"
    ports:
      - "8081:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.scheduler
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-60000}"
    ports:
      - "8082:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  inkflow-postgres:
  inkflow-redis:
