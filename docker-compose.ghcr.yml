# 使用 GHCR 预构建镜像的部署覆盖文件(无需本地构建):
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
# 拉取私有镜像需先登录:
#   docker login ghcr.io -u <用户名>   (密码为 GitHub PAT,需 read:packages)
services:
  migrations:
    image: ghcr.io/nekohands/inkflow-migrations:dev
    build: null

  api:
    image: ghcr.io/nekohands/inkflow-api:dev
    build: null

  worker:
    image: ghcr.io/nekohands/inkflow-worker:dev
    build: null

  scheduler:
    image: ghcr.io/nekohands/inkflow-scheduler:dev
    build: null
