services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: inkflow
      POSTGRES_USER: inkflow
      POSTGRES_PASSWORD: ${INKFLOW_DB_PASSWORD:-inkflow}
    ports:
      - "5432:5432"
    volumes:
      - inkflow-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkflow -d inkflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - inkflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      INKFLOW_OTEL_METRICS_DEBUG_VERBOSITY: "${INKFLOW_OTEL_METRICS_DEBUG_VERBOSITY:-basic}"
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:13133:13133"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrations:
    image: ghcr.io/nekohands/inkflow/inkflow-migrations:dev
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: ghcr.io/nekohands/inkflow/inkflow-api:dev
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      INKFLOW_PACKAGES_ROOT: /var/lib/inkflow/packages
      INKFLOW_PACKAGES_RETENTION_DAYS: ${INKFLOW_PACKAGES_RETENTION_DAYS:-7}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-60000}"
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    volumes:
      - inkflow-packages:/var/lib/inkflow/packages
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    image: ghcr.io/nekohands/inkflow/inkflow-worker:dev
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      INKFLOW_PACKAGES_ROOT: /var/lib/inkflow/packages
      INKFLOW_PACKAGES_RETENTION_DAYS: ${INKFLOW_PACKAGES_RETENTION_DAYS:-7}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-60000}"
    ports:
      - "8081:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    volumes:
      - inkflow-packages:/var/lib/inkflow/packages
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  scheduler:
    image: ghcr.io/nekohands/inkflow/inkflow-scheduler:dev
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-60000}"
    ports:
      - "8082:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  inkflow-postgres:
  inkflow-redis:
  inkflow-packages:
