services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: inkflow
      POSTGRES_USER: inkflow
      POSTGRES_PASSWORD: ${INKFLOW_DB_PASSWORD:-inkflow}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["inkflow-postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkflow -d inkflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${INKFLOW_REDIS_PASSWORD:-inkflow-redis}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["inkflow-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${INKFLOW_REDIS_PASSWORD:-inkflow-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrations
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      ConnectionStrings__Redis: redis:6379,password=${INKFLOW_REDIS_PASSWORD:-inkflow-redis}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      ConnectionStrings__Redis: redis:6379,password=${INKFLOW_REDIS_PASSWORD:-inkflow-redis}
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.scheduler
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=inkflow;Username=inkflow;Password=${INKFLOW_DB_PASSWORD:-inkflow}
      ConnectionStrings__Redis: redis:6379,password=${INKFLOW_REDIS_PASSWORD:-inkflow-redis}
      Scheduler__UpdateIntervalMinutes: ${INKFLOW_UPDATE_INTERVAL_MINUTES:-15}
      Scheduler__PollIntervalSeconds: ${INKFLOW_SCHEDULER_POLL_SECONDS:-30}
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  inkflow-postgres:
  inkflow-redis:
