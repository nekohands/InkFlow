receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 256
  batch/metrics:
    timeout: 1s
    send_batch_size: 256

exporters:
  debug:
    verbosity: basic
  debug/metrics:
    verbosity: "${env:INKFLOW_OTEL_METRICS_DEBUG_VERBOSITY:-basic}"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch/metrics]
      exporters: [debug/metrics]
